# Autonomer Content-Agent
#
# Läuft täglich (und manuell per workflow_dispatch), erzeugt die neue
# Channel-Edition über die Multi-Agent-Pipeline, prüft sie mit denselben
# Qualitätsgates wie die CI und committet das Ergebnis selbstständig.
# Ohne inhaltliche Änderung (Re-Run am selben Tag) wird nichts gepusht.
#
# Wichtig: Der Channel wird VOR dem optionalen YouTube-Upload committed.
# Auth-/Config-Fehler bei YouTube dürfen den Daily Channel nie blockieren.

name: Content Agent

on:
  schedule:
    # Täglich 05:17 UTC – bewusst nicht zur vollen Stunde (GitHub-Cron-Last).
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-agent
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Für das Rendern des Daily-Videos (nicht auf dem Runner vorinstalliert).
      - name: ffmpeg installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Qualitätsgate (Lint & Tests)
        run: |
          deno lint
          deno test -A

      - name: Pipeline ausführen
        run: deno task agent

      # Channel zuerst committen – unabhängig vom optionalen YouTube-Schritt.
      - name: Channel committen & pushen
        run: |
          git config user.name "flowforge-content-agent[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content
          if git diff --cached --quiet; then
            echo "Keine inhaltlichen Änderungen – nichts zu committen."
          else
            git commit -m "chore(agent): Channel-Edition $(date -u +%F)"
            git push
          fi

      # Lädt das Daily-Video auf YouTube hoch, sobald die drei Secrets
      # hinterlegt sind. Ohne Secrets oder bei Auth-Fehlern: Skip (Exit 0).
      # continue-on-error: selbst unerwartete Throws blockieren den Channel nicht.
      - name: YouTube-Upload (optional)
        id: youtube
        continue-on-error: true
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY: ${{ vars.YOUTUBE_PRIVACY }}
        run: deno task youtube

      - name: YouTube-Log committen (falls Upload lief)
        if: always()
        run: |
          git config user.name "flowforge-content-agent[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/youtube-log.json
          if git diff --cached --quiet; then
            echo "Kein YouTube-Log-Update."
          else
            git commit -m "chore(agent): YouTube-Upload $(date -u +%F)"
            git push
          fi
