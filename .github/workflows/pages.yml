# Veröffentlicht die Web-Version (zombie/) auf GitHub Pages.
# Einmalig aktivieren: Settings → Pages → Source: "GitHub Actions".
# Danach erreichbar unter https://<user>.github.io/<repo>/ – die
# Datenschutzerklärung unter .../privacy.html (URL für die Play Console).
name: Web-Version (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "zombie/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: zombie
      - id: deployment
        uses: actions/deploy-pages@v4
