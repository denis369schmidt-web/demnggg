# Veröffentlicht die Web-Version auf GitHub Pages.
# Pages liest den Zweig gh-pages (Ordner /), deshalb schiebt dieser Ablauf den neuesten Stand dorthin.
# Erreichbar unter https://<user>.github.io/<repo>/zombie/ – die
# Datenschutzerklärung unter .../zombie/privacy.html (URL für die Play Console).
name: Web-Version (GitHub Pages)

on:
  push:
    branches: [main, ccr-592df8e9-oqm0to]
    paths:
      - "zombie/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Stand nach gh-pages schieben
        run: git push --force origin HEAD:refs/heads/gh-pages
