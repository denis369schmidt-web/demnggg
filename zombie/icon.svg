<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="60%" r="75%">
      <stop offset="0" stop-color="#335f2c"/>
      <stop offset="0.42" stop-color="#132717"/>
      <stop offset="1" stop-color="#050906"/>
    </radialGradient>
    <radialGradient id="skin" cx="36%" cy="26%" r="85%">
      <stop offset="0" stop-color="#cfe3ad"/>
      <stop offset="0.38" stop-color="#94b476"/>
      <stop offset="0.78" stop-color="#4f6d3f"/>
      <stop offset="1" stop-color="#26381f"/>
    </radialGradient>
    <radialGradient id="socket" cx="50%" cy="42%" r="62%">
      <stop offset="0" stop-color="#070303"/>
      <stop offset="0.65" stop-color="#2a1612"/>
      <stop offset="1" stop-color="#3f3a25" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eye" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff6e8"/>
      <stop offset="0.28" stop-color="#ff6a3a"/>
      <stop offset="0.7" stop-color="#e01414"/>
      <stop offset="1" stop-color="#7a0000"/>
    </radialGradient>
    <linearGradient id="bone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4ecd2"/>
      <stop offset="1" stop-color="#a99a72"/>
    </linearGradient>
    <linearGradient id="mouth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a0b0b"/>
      <stop offset="1" stop-color="#0c0202"/>
    </linearGradient>
    <linearGradient id="ooze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c8ff6a"/>
      <stop offset="1" stop-color="#5cbf1a"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="dot" x="-400%" y="-400%" width="900%" height="900%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="haze" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
    <clipPath id="head">
      <path d="M256 92C342 92 400 150 400 236C400 283 386 313 367 337C356 378 330 425 290 439C268 447 244 447 222 439C182 425 156 379 145 337C126 313 112 283 112 236C112 150 170 92 256 92Z"/>
    </clipPath>
    <clipPath id="left"><rect x="0" y="0" width="236" height="512"/></clipPath>
  </defs>

  <!-- Hintergrund: Giftnebel -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="300" r="200" fill="#8cff4a" opacity="0.2" filter="url(#haze)"/>
  <g fill="#8cff4a" opacity="0.18">
    <circle cx="70" cy="420" r="9"/><circle cx="96" cy="452" r="5"/><circle cx="448" cy="96" r="7"/><circle cx="430" cy="64" r="4"/>
  </g>

  <!-- Fadenkreuz-Ring hinter dem Kopf -->
  <g fill="none" stroke="#8cff4a" stroke-linecap="round" filter="url(#glow)">
    <circle cx="256" cy="266" r="206" stroke-width="13" stroke-dasharray="104 30" stroke-dashoffset="52"/>
  </g>

  <!-- Kopf -->
  <path d="M256 92C342 92 400 150 400 236C400 283 386 313 367 337C356 378 330 425 290 439C268 447 244 447 222 439C182 425 156 379 145 337C126 313 112 283 112 236C112 150 170 92 256 92Z" fill="url(#skin)"/>
  <g clip-path="url(#head)">
    <!-- freiliegender Schädel mit Riss -->
    <path d="M300 96C344 104 382 132 396 180L370 196C356 176 340 168 322 168C318 150 308 138 296 132Z" fill="url(#bone)"/>
    <path d="M330 120l-10 26l14 14l-8 24" fill="none" stroke="#5a4a32" stroke-width="4" stroke-linecap="round"/>
    <path d="M296 132C308 138 318 150 322 168C340 168 356 176 370 196" fill="none" stroke="#7a1414" stroke-width="7" stroke-linecap="round"/>
    <!-- Nähte über der Stirn -->
    <path d="M150 196C176 176 206 166 236 164" fill="none" stroke="#2b1c14" stroke-width="5" stroke-linecap="round"/>
    <path d="M162 176l8 20M180 168l7 20M198 162l6 20M216 159l5 20" stroke="#2b1c14" stroke-width="4" stroke-linecap="round"/>
    <!-- Schatten unter dem Kiefer, Wangen eingefallen -->
    <ellipse cx="256" cy="452" rx="140" ry="40" fill="#0f170c" opacity="0.55"/>
    <path d="M150 300C170 330 180 360 196 392" fill="none" stroke="#2c3f24" stroke-width="18" opacity="0.5" stroke-linecap="round"/>
    <path d="M362 300C342 330 332 360 316 392" fill="none" stroke="#2c3f24" stroke-width="18" opacity="0.6" stroke-linecap="round"/>
    <!-- Wunde auf der Wange -->
    <path d="M330 312l26 -10l-6 18z" fill="#6e0f12"/>
    <path d="M168 270l22 6l-18 10z" fill="#6e0f12"/>
  </g>
  <!-- grünes Kantenlicht links -->
  <path clip-path="url(#left)" d="M256 92C170 92 112 150 112 236C112 283 126 313 145 337C156 379 182 425 222 439" fill="none" stroke="#b6ff7a" stroke-width="7" opacity="0.75"/>
  <path d="M256 92C342 92 400 150 400 236C400 283 386 313 367 337C356 378 330 425 290 439C268 447 244 447 222 439C182 425 156 379 145 337C126 313 112 283 112 236C112 150 170 92 256 92Z" fill="none" stroke="#0b1209" stroke-width="9"/>

  <!-- Brauen & Augenhöhlen -->
  <path d="M160 214C184 196 218 196 238 212" fill="none" stroke="#2c3f24" stroke-width="12" stroke-linecap="round"/>
  <path d="M274 214C294 196 330 194 352 210" fill="none" stroke="#2c3f24" stroke-width="12" stroke-linecap="round"/>
  <ellipse cx="203" cy="242" rx="44" ry="36" fill="url(#socket)" transform="rotate(8 203 242)"/>
  <ellipse cx="310" cy="242" rx="44" ry="36" fill="url(#socket)" transform="rotate(-8 310 242)"/>
  <g filter="url(#glow)">
    <circle cx="205" cy="244" r="17" fill="url(#eye)"/>
    <circle cx="308" cy="244" r="17" fill="url(#eye)"/>
  </g>
  <circle cx="200" cy="239" r="4.5" fill="#fff"/>
  <circle cx="303" cy="239" r="4.5" fill="#fff"/>

  <!-- Nase -->
  <path d="M246 280l-8 22h12zM266 280l8 22h-12z" fill="#1c120c"/>

  <!-- Maul mit Zähnen -->
  <path d="M182 332C220 352 292 352 330 332L318 388C292 414 220 414 194 388Z" fill="url(#mouth)" stroke="#0b1209" stroke-width="6" stroke-linejoin="round"/>
  <path d="M190 338l10 22l10-18l10 24l10-22l10 24l10-22l10 24l10-22l10 24l10-22l10 24l10-22l10 18l8-16Z" fill="url(#bone)"/>
  <path d="M206 392l8-20l10 16l10-20l10 20l10-20l10 20l10-20l10 20l10-20l8 18Z" fill="url(#bone)" opacity="0.92"/>
  <!-- Geifer -->
  <path d="M302 384C306 404 300 420 306 438C310 450 322 448 320 434C318 420 316 404 314 382Z" fill="url(#ooze)"/>
  <circle cx="313" cy="452" r="6" fill="#9be63a"/>

  <!-- Blutspritzer -->
  <g fill="#b0141a">
    <circle cx="372" cy="356" r="8"/><circle cx="388" cy="376" r="4"/><circle cx="140" cy="364" r="5"/><circle cx="398" cy="330" r="3"/>
  </g>

  <!-- Fadenkreuz vorne + Laserpunkt auf der Stirn -->
  <g stroke="#8cff4a" stroke-width="13" stroke-linecap="round" filter="url(#glow)">
    <path d="M256 40v58M256 434v58M30 266h58M424 266h58"/>
  </g>
  <circle cx="256" cy="168" r="9" fill="#ff2b2b" filter="url(#dot)"/>
  <circle cx="256" cy="168" r="3.5" fill="#fff"/>
</svg>
